<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KUNIUMI — 星をつくる景観工房</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23d9b56c'/%3E%3Cpath d='M3 20 L11 12 L16 17 L21 10 L29 20 Z' fill='%230b0f1a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/src/index.js",
        "three-mesh-bvh/webgpu": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/src/webgpu/index.js",
        "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.26/src/index.js",
        "three-gpu-pathtracer/webgpu": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.26/src/webgpu/index.js",
        "oidn-web": "https://cdn.jsdelivr.net/npm/oidn-web@0.4.0/dist/oidn.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header id="bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-ja">国産み</span>
        <span class="brand-en">KUNIUMI</span>
      </div>
      <input id="world-name" class="world-name" type="text" spellcheck="false" title="この星の名前" />
      <div class="tools">
        <div class="group">
          <span class="group-label">星のひな形</span>
          <select id="preset"></select>
        </div>
        <div class="group">
          <button id="render-still" class="primary" title="パストレースで実写調の一枚絵を描く（WebGPU）">✦ 一枚絵を描く</button>
        </div>
        <div class="group">
          <span class="group-label">シーン</span>
          <button data-act="open-json" title="シーン（.json）を開く">開く</button>
          <button data-act="save-json" title="シーンを .json で保存">保存</button>
        </div>
        <div class="group">
          <span class="group-label">連携</span>
          <button data-act="export-glb" title="地形・水・太陽・カメラを .glb で書き出す">glb 書出</button>
          <button data-act="import-glb" title=".glb / .gltf を読み込む（地形はメッシュの形から取り込み）">glb 読込</button>
          <button data-act="export-hm" title="地形を 16bit グレースケール PNG で書き出す">ハイトマップ書出</button>
          <button data-act="import-hm" title="ハイトマップ画像（16bit PNG 推奨）を読み込む">ハイトマップ読込</button>
          <button data-act="export-py" title="glb を読み込んで空・カメラ・レンダー設定まで整える Blender 用スクリプト">Blender 用 .py</button>
        </div>
      </div>
    </header>
    <main id="stage">
      <canvas id="view"></canvas>
      <nav id="create" aria-label="創造">
        <div class="create-title">創造</div>
        <button data-shape="sphere" title="球を置く"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="8.5" ry="3"/></svg><span>球</span></button>
        <button data-shape="box" title="立方体を置く"><svg viewBox="0 0 24 24"><path d="M12 3.5 20 8v8l-8 4.5L4 16V8z"/><path d="M4 8l8 4.5L20 8M12 12.5v8"/></svg><span>立方体</span></button>
        <button data-shape="cylinder" title="円柱を置く"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6"/></svg><span>円柱</span></button>
        <button data-shape="cone" title="円錐を置く"><svg viewBox="0 0 24 24"><path d="M12 3 5 18c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6z"/><path d="M5 18c0-1.4 3.1-2.6 7-2.6s7 1.2 7 2.6" opacity=".5"/></svg><span>円錐</span></button>
        <button data-shape="pyramid" title="角錐を置く"><svg viewBox="0 0 24 24"><path d="M12 3 3.5 17l8.5 3.5 8.5-3.5z"/><path d="M12 3v17.5"/></svg><span>角錐</span></button>
        <button data-shape="torus" title="トーラスを置く"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="5"/><ellipse cx="12" cy="11.4" rx="4" ry="1.7"/></svg><span>トーラス</span></button>
        <button data-shape="ring" title="平たい環を置く（惑星の環に）"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="5.5" ry="2"/></svg><span>環</span></button>
        <div class="create-sep"></div>
        <button data-shape="celestial" class="celestial" title="空に浮かぶ天体を置く"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5"/><ellipse cx="12" cy="12" rx="10.5" ry="3.2" transform="rotate(-18 12 12)"/><path d="M4 4.5h.01M20 5h.01M18.5 20h.01" stroke-width="2.4" stroke-linecap="round"/></svg><span>天体</span></button>
        <div class="create-sep"></div>
        <div class="gizmo-modes" role="group" aria-label="選んだ物体の操作">
          <button data-gizmo="translate" class="on" title="移動（W）">移</button>
          <button data-gizmo="rotate" title="回転（E）">回</button>
          <button data-gizmo="scale" title="拡大縮小（R）">拡</button>
        </div>
      </nav>
      <div id="hud">
        <div id="busy" hidden><span class="spinner"></span>大地を生成中</div>
        <div class="hint">左ドラッグ: 回転　右ドラッグ: 移動　ホイール: 寄る／引く　クリック: 物体を選ぶ　W/E/R: 移動/回転/拡大　Delete: 削除　Ctrl+D: 複製</div>
      </div>
      <div id="toast" hidden></div>
      <div id="drop" hidden><div>ここに落とすと読み込みます<small>.json（シーン）／ .glb（モデル）／ .png（ハイトマップ）</small></div></div>
    </main>
    <aside id="panel"></aside>
  </div>
  <div id="still" hidden>
    <div class="still-box" role="dialog" aria-label="一枚絵">
      <div class="still-head">
        <span class="still-title">一枚絵</span>
        <span id="still-status"></span>
        <button id="still-close" type="button">中止</button>
      </div>
      <div class="still-view" id="still-view"></div>
      <div class="still-bar">
        <div class="still-progress"><i id="still-progress"></i></div>
        <span id="still-info"></span>
      </div>
      <div class="still-actions" id="still-actions" hidden>
        <button type="button" data-still="png">PNG を保存</button>
        <button type="button" data-still="hdr" title="線形 HDR（Radiance .hdr）。合成ソフトでの調整に">HDR を保存</button>
        <button type="button" data-still="again">もう一度描く</button>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
